<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ctrl — Portfolio</title>
  <meta name="description" content="Ctrl's personal portfolio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Abstract animated background -->
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="grain"></span>
  </div>
  <div class="glow" id="glow" aria-hidden="true"></div>

  <header class="nav">
    <a class="logo" href="#top">ctrl<span>_</span></a>
  </header>

  <main id="top">
    <section class="hero">
      <div class="shape s1" aria-hidden="true"></div>
      <div class="shape s2" aria-hidden="true"></div>
      <div class="shape s3" aria-hidden="true"></div>

      <div class="avatar reveal">
        <div class="avatar-inner">
          <span class="avatar-fallback">C</span>
          <!-- Drop your picture next to index.html and name it profile.png -->
          <img src="profile.png" alt="Ctrl's profile picture" onerror="this.remove()">
        </div>
      </div>

      <p class="eyebrow reveal" style="--d:.1s">Hello, I'm</p>
      <h1 class="reveal" style="--d:.2s">Ctrl<span class="dot">.</span></h1>

      <!-- EDIT YOUR BIO HERE -->
      <p class="bio reveal" style="--d:.3s" id="bio">
        This is where your bio goes. Tell people who you are, what you build,
        and what you're into. Edit this text in <code>index.html</code>.
      </p>

      <div class="actions reveal" style="--d:.4s">
        <button class="btn btn-primary" id="discordBtn" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18 18 0 0 0-4.4 0L10.6 3a19.8 19.8 0 0 0-4.9 1.4C2.6 9 1.8 13.5 2.2 18a19.9 19.9 0 0 0 6 3l.8-1.3a13 13 0 0 1-2-.9l.5-.4a14.2 14.2 0 0 0 12.1 0l.5.4a13 13 0 0 1-2 .9l.8 1.3a19.9 19.9 0 0 0 6-3c.5-5.2-.8-9.700-3.600-13.600ZM8.700 15.300c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400Zm6.600 0c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400Z"/></svg>
          Discord
        </button>
        <a class="btn btn-ghost" id="mainLink" href="http://40.160.56.74:28024/" target="_blank" rel="noopener">
          <span id="mainLinkLabel">Visit</span>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7 17 17 7M8 7h9v9"/></svg>
        </a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>© <span id="year"></span> Ctrl</span>
  </footer>

  <!-- Discord modal -->
  <dialog id="discordModal" class="modal">
    <form method="dialog" class="modal-body">
      <button class="modal-close" aria-label="Close" value="close">×</button>
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18 18 0 0 0-4.4 0L10.6 3a19.8 19.8 0 0 0-4.9 1.4C2.6 9 1.8 13.5 2.2 18a19.9 19.9 0 0 0 6 3l.8-1.3a13 13 0 0 1-2-.9l.5-.4a14.2 14.2 0 0 0 12.1 0l.5.4a13 13 0 0 1-2 .9l.8 1.3a19.9 19.9 0 0 0 6-3c.5-5.2-.8-9.700-3.600-13.600ZM8.700 15.300c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400Zm6.600 0c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400Z"/></svg>
      </div>
      <h3>Open Discord?</h3>
      <p>This will open the Discord app and show <strong id="modalHandle">@itzctrl</strong>'s profile.</p>
      <div class="modal-actions">
        <a class="btn btn-primary" id="openDiscordApp" href="#">Open Discord app</a>
        <a class="btn btn-ghost" id="openDiscordWeb" href="#" target="_blank" rel="noopener">Open in browser</a>
      </div>
      <button type="button" class="copy" id="copyHandle">Copy username</button>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
