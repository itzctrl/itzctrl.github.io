name: Update Valorant stats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valorant
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch rank + recent games
        run: node scripts/update-valorant.mjs
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
          VAL_NAME: ${{ vars.VAL_NAME }}
          VAL_TAG: ${{ vars.VAL_TAG }}
          VAL_REGION: ${{ vars.VAL_REGION }}
          VAL_QUEUE: ${{ vars.VAL_QUEUE }}   # optional: leave unset for competitive, or set to all / unrated

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/valorant.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/valorant.json
            git commit -m "chore: update valorant stats"
            git push
          else
            echo "Nothing to commit."
          fi
